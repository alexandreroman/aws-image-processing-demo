# pnpm 12 requires every dependency build script to be approved here:
# without this list, `pnpm install` fails with ERR_PNPM_IGNORED_BUILDS.
# All three packages compile or fetch a native binary at install time,
# and esbuild's platform binary is required for the Nuxt build to run.
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true

# Targeted exemption to pnpm 12's minimumReleaseAge policy.
# enhanced-resolve is pulled in transitively by @tailwindcss/node, and
# pnpm rejects it for being published too recently, not for anything in
# its contents. Drop this entry once the version is past the 24h window.
minimumReleaseAgeExclude:
  - enhanced-resolve
